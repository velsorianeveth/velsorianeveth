<svg width="600" height="360" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3A6C8"/>
      <stop offset="45%" stop-color="#F6B7C9"/>
      <stop offset="100%" stop-color="#F5DFA1"/>
    </linearGradient>

    <linearGradient id="pinkText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFA7C5"/>
      <stop offset="100%" stop-color="#F4B6CE"/>
    </linearGradient>

    <linearGradient id="yellowText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8D99B"/>
      <stop offset="100%" stop-color="#F3E4AE"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- TITLE -->

  <text
    x="300"
    y="48"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="31"
    font-style="italic"
    font-weight="bold"
    letter-spacing="2"
    fill="url(#titleGradient)"
    filter="url(#softGlow)">
    About me
  </text>

  <text
    x="215"
    y="48"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="15"
    fill="#F1B3C9">
    ✦
  </text>

  <text
    x="385"
    y="48"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="15"
    fill="#EBD99D">
    ✦
  </text>


  <!-- PINK SECTION -->

  <text
    x="300"
    y="92"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-style="italic"
    fill="url(#pinkText)">
    ♡ I'm Ken, 15 and turning 16!!
  </text>

  <text
    x="300"
    y="120"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-style="italic"
    fill="url(#pinkText)">
    ♡ I'm an extrovert and pretty easy to talk to &amp; get along with!
  </text>

  <text
    x="300"
    y="148"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-style="italic"
    fill="url(#pinkText)">
    ♡ So don't be shy — feel free to come play or chat with me!
  </text>

  <!-- NEW PINK LINE -->

  <text
    x="300"
    y="176"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-style="italic"
    fill="url(#pinkText)">
    ♡ I really enjoy meeting new people &amp; making new friends!
  </text>


  <!-- YELLOW SECTION -->

  <text
    x="300"
    y="220"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13.5"
    font-style="italic"
    fill="url(#yellowText)">
    ✦ If I'm quiet sometimes, don't take it personally —
  </text>

  <text
    x="300"
    y="247"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13.5"
    font-style="italic"
    fill="url(#yellowText)">
    I can get annoyed or overwhelmed by a lot of things.
  </text>

  <text
    x="300"
    y="276"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13.5"
    font-style="italic"
    fill="url(#yellowText)">
    ✦ With people I'm really close to, I'll definitely show more of myself.
  </text>

  <text
    x="300"
    y="305"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-style="italic"
    fill="url(#yellowText)">
    ✦ Fandoms: Minecraft ARG · UU · Roblox ARG · Bad Things · BSD
  </text>


  <!-- BOTTOM ORNAMENT -->

  <text
    x="300"
    y="338"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="14"
    fill="#EAB5C8"
    letter-spacing="4">
    ˚₊‧ ✦ ‧₊˚
  </text>

</svg>
